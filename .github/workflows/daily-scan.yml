name: Tadawul Daily Scan

on:
  schedule:
    # Saudi market days: Sunday–Thursday
    # Repeated attempts after market close
    # UTC times = Saudi time +3 hours
    - cron: '17,32,47 13-15 * * 0-4'

  workflow_dispatch:

jobs:
  daily-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Tadawul daily scan
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python daily_runner.py
